<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Viv Imagine</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
</head>
<body>
<div class="page">

    <!-- Header -->
    <header class="page-header">
        <h1>Viv Imagine</h1>
        <div class="header-right">
            <div class="status-pill">
                <div class="status-dot" id="status-dot"></div>
                <span id="queue-status">Ready</span>
            </div>
        </div>
    </header>

    <!-- Main studio card -->
    <div class="studio-card">

        <!-- Model hint -->
        <div class="model-hint" id="model-hint"></div>

        <!-- Upload zone (contextual per model) -->
        <div class="upload-zone" id="upload-zone"></div>

        <!-- Prompt -->
        <div class="prompt-area">
            <div id="prompt-input"
                 class="prompt-editor"
                 contenteditable="true"
                 data-placeholder="Describe your video..."></div>
            <!-- @Image tag chips -->
            <div id="ref-tags"></div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="toolbar-left">
                <button class="tb-icon-btn" id="btn-add-primary" title="Add image">+</button>
                <button class="tb-icon-btn" id="btn-settings-toggle" title="Settings">⚙</button>
                <button class="tb-icon-btn" id="btn-enhance-prompt" title="Enhance prompt with AI" style="font-size:12px;font-weight:700;width:auto;padding:0 10px;color:var(--neon-purple);border-color:rgba(180,74,255,0.3);background:rgba(180,74,255,0.1);">✦ Enhance</button>
                <div class="model-select-wrap">
                    <span class="model-type-badge badge-r2v" id="model-badge">R2V</span>
                    <select id="model-select" class="model-select-inner">
                        <optgroup label="── Reference-to-Video (R2V) ──">
                            <option value="grok-imagine-reference-to-video">Grok Imagine R2V</option>
                            <option value="kling-o3-pro-reference-to-video">Kling O3 Pro R2V</option>
                            <option value="kling-o3-standard-reference-to-video">Kling O3 Std R2V</option>
                        </optgroup>
                        <optgroup label="── Image-to-Video (I2V) ──">
                            <option value="seedance-1-5-pro-image-to-video">Seedance 1.5 Pro</option>
                            <option value="wan-2.6-image-to-video">Wan 2.6</option>
                        </optgroup>
                    </select>
                    <span class="model-chevron">▾</span>
                </div>
            </div>
            <div class="toolbar-right">
                <button id="btn-quote" class="tb-estimate-btn">~ Estimate</button>
                <button id="btn-generate" class="tb-generate-btn">Generate →</button>
            </div>
        </div>

        <!-- Settings panel (hidden by default) -->
        <div class="settings-panel hidden" id="settings-panel">
            <div class="setting-group">
                <span class="setting-label">Aspect Ratio</span>
                <select id="aspect-ratio" class="input-field">
                    <option value="16:9">16:9 — Wide</option>
                    <option value="9:16">9:16 — Tall / Mobile</option>
                    <option value="1:1">1:1 — Square</option>
                    <option value="4:3">4:3 — Classic</option>
                    <option value="3:2">3:2 — Photo</option>
                    <option value="2:3">2:3 — Portrait</option>
                    <option value="3:4">3:4 — Vertical</option>
                </select>
            </div>
            <div class="setting-group" id="setting-duration">
                <span class="setting-label">Duration</span>
                <select id="duration" class="input-field">
                    <option value="5">5 seconds</option>
                    <option value="8">8 seconds</option>
                    <option value="10">10 seconds</option>
                </select>
            </div>
            <div class="setting-group" id="setting-resolution">
                <span class="setting-label">Resolution</span>
                <select id="resolution-toggle" class="input-field">
                    <option value="480p">480p</option>
                    <option value="720p">720p</option>
                </select>
            </div>
            <div class="setting-group hidden" id="setting-audio">
                <span class="setting-label">Audio</span>
                <select id="audio-toggle" class="input-field">
                    <option value="false">Off</option>
                    <option value="true">On — Synced</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Kling elements panel (only visible for Kling models) -->
    <div class="elements-panel hidden" id="kling-elements-panel">
        <div class="elements-panel-header">
            <span class="elements-panel-title">Character Elements</span>
            <button class="btn-add-element" id="btn-add-element">+ Add Element</button>
        </div>
        <div class="elements-grid" id="elements-container"></div>
    </div>

    <!-- Output section -->
    <div class="output-section hidden" id="output-section">
        <div class="output-header">
            <span class="output-title">Output</span>
            <span class="output-badge ready" id="output-badge">Ready</span>
        </div>
        <div class="output-content" id="output-content"></div>
    </div>

    <!-- Log -->
    <div class="log-console" id="log-console">
        <p>Ready. Enter your API key below.</p>
    </div>

    <!-- Bottom bar: API key + clear -->
    <div class="bottom-bar">
        <div class="api-key-wrap">
            <label>API KEY</label>
            <input type="password" id="api-key" class="api-key-input" placeholder="Paste your Venice AI key here">
        </div>
        <button id="btn-clear" class="btn-clear">Clear All</button>
    </div>

    <div class="key-promo">
        Don't have a key? <a href="https://venice.ai/chat?ref=yN8qqI" target="_blank" rel="noopener">Get one at Venice AI</a> — sign up and receive <strong>$10 free credits</strong> to start generating.
    </div>

</div>

<!-- Kling element template -->
<template id="element-template">
    <div class="element-card" data-id="{id}">
        <div class="element-card-header">
            <span>@Element{num}</span>
            <button class="btn-remove-element" title="Remove">&times;</button>
        </div>
        <div class="element-card-body">
            <div class="element-upload-slot frontal-box" title="Click to upload frontal photo">
                <span class="slot-icon-txt">+ Frontal Photo</span>
                <input type="file" accept="image/*" class="hidden-input frontal-input">
            </div>
            <div class="element-upload-slot ref-box" title="Click to upload reference angles (max 3)">
                <span class="slot-icon-txt">+ Ref Angles (3 max)</span>
                <input type="file" multiple accept="image/*" class="hidden-input element-ref-input">
            </div>
            <div class="element-refs-row"></div>
        </div>
    </div>
</template>

<script src="app.js"></script>
</body>
</html>
